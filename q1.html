<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RefactorX - Round 1</title>

<script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
padding:20px;
font-family:"JetBrains Mono", monospace;

background-image:
linear-gradient(rgba(2,6,23,0.9),rgba(2,6,23,0.9)),
url("IMG-20260130-WA0011.jpg");

background-size:cover;
background-position:center;

color:#cbd5f5;
}

.page{
max-width:900px;
margin:auto;
}

h2{
text-align:center;
background:linear-gradient(90deg,#3b82f6,#8b5cf6,#ec4899);
-webkit-background-clip:text;
color:transparent;
}

.timer{
font-weight:bold;
font-size:18px;
color:#ec4899;
}

.problem-box{
background:rgba(15,23,42,0.85);
padding:25px;
border-radius:12px;
border:1px solid #8b5cf6;
margin-bottom:25px;
}

pre{
background:#020617;
color:#60a5fa;
padding:15px;
border-radius:8px;
overflow-x:auto;
}

textarea{
width:100%;
height:150px;
background:#020617;
color:#e2e8f0;
border:1px solid #8b5cf6;
border-radius:6px;
padding:10px;
font-family:monospace;
margin-top:10px;
}

button{
padding:10px 15px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
border:1px solid #8b5cf6;
background:transparent;
color:white;
margin-top:10px;
}

.output{
background:#020617;
color:#22c55e;
padding:10px;
margin-top:10px;
border-radius:6px;
min-height:50px;
border:1px solid #8b5cf6;
}

</style>
</head>

<body>

<div class="page">

<h2>RefactorX – Round 1</h2>

<p>Refactor the code into <b>10 lines or less</b>.</p>

<p><b>Time Remaining:</b>
<span id="timer" class="timer">20:00</span>
</p>

<!-- QUESTION 1 -->

<div class="problem-box">

<h3>Question 1 – Second Largest Number</h3>

<p>Input numbers: <b>5 2 8 3 7</b></p>

<textarea id="q1"></textarea>

<button onclick="runCode('q1')">Run Code</button>

<div id="q1_output" class="output"></div>

</div>

<!-- QUESTION 2 -->

<div class="problem-box">

<h3>Question 2 – Count Vowels</h3>

<p>Input text: <b>programming</b></p>

<textarea id="q2"></textarea>

<button onclick="runCode('q2')">Run Code</button>

<div id="q2_output" class="output"></div>

</div>

<!-- QUESTION 3 -->

<div class="problem-box">

<h3>Question 3 – Most Frequent Word</h3>

<p>Sentence: <b>apple banana apple orange apple</b></p>

<textarea id="q3"></textarea>

<button onclick="runCode('q3')">Run Code</button>

<div id="q3_output" class="output"></div>

</div>

<button onclick="submitCode()">Submit Round</button>

<button id="nextBtn" onclick="goNext()" disabled>Next Round</button>

</div>

<script>

/* PYTHON ENGINE */

let pyodide;

async function loadPython(){
pyodide = await loadPyodide();
}

loadPython();


/* EXPECTED OUTPUTS */

const expected={
q1:"7",
q2:"3",
q3:"apple"
};


/* FIXED INPUTS */

const inputs={
q1:"5\n2\n8\n3\n7",
q2:"programming",
q3:"apple banana apple orange apple"
};


/* RUN CODE */

async function runCode(id){

let code=document.getElementById(id).value;

try{

await pyodide.runPythonAsync(`
import sys
from io import StringIO
sys.stdin = StringIO("${inputs[id]}")
sys.stdout = StringIO()
`)

await pyodide.runPythonAsync(code)

let output=await pyodide.runPythonAsync(`
sys.stdout.getvalue()
`)

output=output.trim()

let box=document.getElementById(id+"_output")

box.innerText="Output: "+output

if(output===expected[id]){

box.innerText+="\n\n✅ Correct Answer"
box.dataset.result="true"

}else{

box.innerText+="\n\n❌ Wrong Answer"
box.dataset.result="false"

}

}
catch(err){

document.getElementById(id+"_output").innerText="Error:\n"+err

}

}


/* SUPABASE */

const { createClient } = supabase;

const supabaseClient=createClient(
"https://uziujuuyuaylhqokqdup.supabase.co",
"YOUR_ANON_KEY"
);


/* SUBMIT */

async function submitCode(){

let team=prompt("Enter Team Name")

let q1=document.getElementById("q1").value
let q2=document.getElementById("q2").value
let q3=document.getElementById("q3").value

let q1c=document.getElementById("q1_output").dataset.result==="true"
let q2c=document.getElementById("q2_output").dataset.result==="true"
let q3c=document.getElementById("q3_output").dataset.result==="true"

const { error } = await supabaseClient
.from("submissions")
.insert([{
team_name:team,
q1:q1,
q2:q2,
q3:q3,
q1_correct:q1c,
q2_correct:q2c,
q3_correct:q3c,
timestamp:new Date().toLocaleString()
}])

if(error){

alert("Submission Failed")

}else{

alert("Submission Saved")

localStorage.setItem("round1_complete","yes")

document.getElementById("nextBtn").disabled=false

}

}


/* NEXT ROUND */

function goNext(){

if(localStorage.getItem("round1_complete")=="yes"){

window.location.href="q2.html"

}else{

alert("Complete Round 1 first")

}

}


/* TIMER */

function startTimer(minutes){

let saved=localStorage.getItem("round1_time")

let time=saved?parseInt(saved):minutes*60

const timer=setInterval(function(){

let m=Math.floor(time/60)
let s=time%60

if(s<10)s="0"+s

document.getElementById("timer").textContent=m+":"+s

time--

localStorage.setItem("round1_time",time)

if(time<0){

clearInterval(timer)

alert("Time Over")

submitCode()

document.getElementById("nextBtn").disabled=false

}

},1000)

}

startTimer(20)

</script>

</body>
</html>
